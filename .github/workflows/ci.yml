name: CI

# Validação continua em cada push / PR.
# 1. Instala dependências (npm ci)
# 2. Roda lint (não bloqueia)
# 3. Type-check (tsc) + build do Vite
# Mantém o código sempre verde antes do release manual.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type-check & build (Vite)
        run: npm run build
        env:
          # Evita travar o electron-builder no CI quando só queremos validar o Vite build
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Vite build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3
