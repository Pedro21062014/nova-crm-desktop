name: Build & Release Desktop App

# Workflow disparado manualmente via Actions tab -> "Run workflow".
# Informe a versao (ex: v2.9.0) e o pipeline:
#   1. Sincroniza a versão do package.json com a tag informada
#   2. Builda em paralelo Windows (.exe NSIS), Linux (.deb/.AppImage) e macOS (.dmg x64 + arm64)
#   3. Publica os instaladores + latest*.yml (auto-update do electron-updater) no Release
#
# Requisitos:
#   - permissions: contents: write (ja habilitado abaixo)
#   - O token default GITHUB_TOKEN é suficiente (não precisa de PAT)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão/tag do release (ex: v2.9.0)'
        required: true
        default: 'v2.9.0'
      prerelease:
        description: 'Marcar como pré-release?'
        required: false
        type: boolean
        default: false
      make_latest:
        description: 'Marcar como latest release?'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            label: Windows
          - os: ubuntu-latest
            platform: linux
            label: Linux
          - os: macos-latest
            platform: mac
            label: macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync package.json version with tag
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          echo "Version: $VERSION"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          " "$VERSION"

      - name: Build & package (${{ matrix.platform }})
        run: npm run electron:build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Linux: o electron-builder só precisa de Docker/snap para target snap (não usado)
          # Mac: desabilita code signing automático (sem Apple Developer ID)
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Desabilita notarização (sem Apple ID)
          APPLE_ID: ""
          APPLE_APP_SPECIFIC_PASSWORD: ""
          APPLE_TEAM_ID: ""

      - name: Verify artifacts
        shell: bash
        run: |
          echo "=== Artifacts in release/ ==="
          ls -la release/ || true
          echo ""
          echo "=== Filtered installers ==="
          ls -la release/*.exe release/*.deb release/*.dmg release/*.AppImage release/latest*.yml 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.deb
            release/*.dmg
            release/*.AppImage
            release/*.tar.gz
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la artifacts/
          echo ""
          echo "=== Sizes ==="
          du -h artifacts/* 2>/dev/null || true

      - name: Generate release notes
        shell: bash
        run: |
          # Prefere o CHANGELOG.md (descrições amigáveis, em pt-BR): extrai a seção da versão atual
          if [ -f CHANGELOG.md ]; then
            awk '/^## \[/{if (n>=1) exit; n++} n>=1{print}' CHANGELOG.md > RELEASE_NOTES.md
          else
            # Fallback: lista de commits (sem hash, para não gerar links de commit nas notes)
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -z "$PREV_TAG" ]; then
              NOTES="Release ${{ inputs.version }} — first automated build pipeline."
            else
              NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD 2>/dev/null | head -50)
            fi
            printf '%s\n' "$NOTES" > RELEASE_NOTES.md
          fi
          echo "=== Release notes ==="
          cat RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Nova CRM ${{ inputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.exe
            artifacts/*.deb
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.tar.gz
            artifacts/latest*.yml
            artifacts/*.blockmap
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
